ni<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Page</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
        }

        #message {
            display: none;
            margin-top: 30px;
        }

        h1 {
            color: white;
            font-size: 35px;
        }

        .red {
            color: red;
        }

        .green {
            color: lime;
        }

        .blue {
            color: dodgerblue;
        }
    </style>
</head>

<body>

    <!-- Ye pehle dikhega -->
    <button onclick="showMessage()">
        CLICK ME
    </button>

    <!-- Ye click karne ke BAAD dikhega -->
    <div id="message">

        <h1>क्या बे लोडू चल जा 😂</h1>

        <p>
            <span class="red">LOL</span>
            <span class="green">YOU'RE</span>
            <span class="blue">ඞ GAY</span>
        </p>

    </div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
    document.querySelector("button").style.display = "none";
}
</script>
