<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Page</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 35px;
        }

        p {
            font-size: 25px;
            font-weight: bold;
        }

        .red {
            color: red;
        }

        .green {
            color: lime;
        }

        .blue {
            color: dodgerblue;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: dodgerblue;
        }
    </style>
</head>

<body>

    <h1>क्या बे लोडू चल जा 😂</h1>

    <p>
        <span class="red">LOL</span>
        <span class="red">YOU'RE</span>
        <span class="red">ඞ GAY</span>
    </p>

    <button onclick="alert('😂 LOL!')">
        CLICK ME
    </button>

</body>
</html>
